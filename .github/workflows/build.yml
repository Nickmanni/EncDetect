name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet & Test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - name: Windows-Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/EncDetect.exe ./cmd/encdetect
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/encdetect-cli.exe ./cmd/encdetect-cli
      - uses: actions/upload-artifact@v4
        with:
          name: EncDetect-Windows
          path: dist/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && zip EncDetect-${GITHUB_REF_NAME}-Windows.zip EncDetect.exe encdetect-cli.exe
          gh release create "$GITHUB_REF_NAME" EncDetect-${GITHUB_REF_NAME}-Windows.zip --title "EncDetect $GITHUB_REF_NAME" --generate-notes
