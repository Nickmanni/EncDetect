name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet & Test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - name: Windows-Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/EncDetect.exe ./cmd/encdetect
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/encdetect-cli.exe ./cmd/encdetect-cli
      - uses: actions/upload-artifact@v4
        with:
          name: EncDetect-Windows
          path: dist/*.exe
      - name: Release
        # Tag-Push oder auf GitHub veröffentlichtes Release: EXE-Dateien anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp README.md dist/
          cd dist && zip "EncDetect-${TAG}-Windows.zip" EncDetect.exe encdetect-cli.exe README.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "EncDetect $TAG" --generate-notes
          gh release upload "$TAG" "EncDetect-${TAG}-Windows.zip" -R "$GITHUB_REPOSITORY" --clobber
